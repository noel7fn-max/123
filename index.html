<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto eBay PC Search Bot & FPS Checker</title>
    <style>
        :root {
            --bg: #090d16;
            --card: #151c2c;
            --accent: #6366f1;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --text: #f8fafc;
            --subtext: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.8rem;
            margin: 0 0 5px 0;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95rem;
            color: var(--subtext);
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: var(--danger);
            border-radius: 50%;
        }

        .pulse-dot.active {
            background-color: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .controls-card {
            background: var(--card);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            color: #fff;
        }

        .btn-start { background: var(--success); }
        .btn-stop { background: var(--danger); }
        .btn-clear { background: #334155; }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pc-card {
            background: var(--card);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid #1e293b;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
        }

        .pc-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0;
        }

        .pc-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #38bdf8;
            white-space: nowrap;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .badge-extreme { background: #8b5cf6; color: #fff; }
        .badge-good { background: var(--success); color: #fff; }
        .badge-ok { background: var(--warning); color: #000; }
        .badge-bad { background: var(--danger); color: #fff; }

        .fps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .fps-box {
            background: #090d16;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #1e293b;
        }

        .fps-box div {
            font-size: 0.75rem;
            color: var(--subtext);
        }

        .fps-value {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent);
            margin-top: 2px;
        }

        @media (max-width: 600px) {
            .fps-grid { grid-template-columns: repeat(2, 1fr); }
            .controls-card { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🤖 Auto-eBay PC Search Bot & KI Scanner</h1>
        <div class="status-bar">
            <span id="dot" class="pulse-dot"></span>
            <span id="statusText">Bot gestoppt</span>
        </div>
    </div>

    <div class="controls-card">
        <button id="toggleBtn" class="btn btn-start" onclick="toggleBot()">Bot Starten 🚀</button>
        <div class="slider-group">
            <label for="interval">Such-Intervall:</label>
            <input type="range" id="interval" min="2" max="10" value="4" onchange="updateInterval(this.value)">
            <span id="intervalVal">4s</span>
        </div>
        <button class="btn btn-clear" onclick="clearFeed()">Feed Leeren 🗑️</button>
    </div>

    <div id="feed" class="feed-container">
        <!-- Gefundene PCs landen hier -->
    </div>
</div>

<script>
let isRunning = false;
let botInterval = null;
let searchSpeed = 4000;

// GPU Datenbank
const GPU_DB = {
    "rtx 4090": { score: 100, fortnite: 360, gta: 180, roblox: 240, minecraft: 450 },
    "rtx 4080": { score: 85, fortnite: 300, gta: 160, roblox: 240, minecraft: 380 },
    "rtx 4070 ti": { score: 75, fortnite: 270, gta: 145, roblox: 240, minecraft: 340 },
    "rtx 4070": { score: 68, fortnite: 240, gta: 135, roblox: 240, minecraft: 300 },
    "rtx 4060 ti": { score: 55, fortnite: 200, gta: 110, roblox: 240, minecraft: 250 },
    "rtx 4060": { score: 48, fortnite: 180, gta: 95, roblox: 240, minecraft: 220 },
    "rtx 3090": { score: 77, fortnite: 280, gta: 150, roblox: 240, minecraft: 350 },
    "rtx 3080": { score: 70, fortnite: 250, gta: 140, roblox: 240, minecraft: 310 },
    "rtx 3070": { score: 58, fortnite: 210, gta: 115, roblox: 240, minecraft: 260 },
    "rtx 3060 ti": { score: 52, fortnite: 190, gta: 105, roblox: 240, minecraft: 230 },
    "rtx 3060": { score: 42, fortnite: 160, gta: 90, roblox: 240, minecraft: 200 },
    "gtx 1660 super": { score: 31, fortnite: 120, gta: 70, roblox: 160, minecraft: 150 },
    "gtx 1650": { score: 18, fortnite: 70, gta: 45, roblox: 110, minecraft: 90 },
    "gtx 1060": { score: 22, fortnite: 85, gta: 52, roblox: 125, minecraft: 110 },
    "rx 7800 xt": { score: 69, fortnite: 245, gta: 135, roblox: 240, minecraft: 310 },
    "rx 6700 xt": { score: 53, fortnite: 195, gta: 105, roblox: 240, minecraft: 240 },
    "rx 6600": { score: 39, fortnite: 145, gta: 80, roblox: 200, minecraft: 180 },
    "rx 580": { score: 20, fortnite: 80, gta: 48, roblox: 120, minecraft: 100 }
};

// Testangebote-Simulator
const MOCK_LISTINGS = [
    { title: "Gaming PC RTX 3060 Ryzen 5 5600 16GB RAM SSD", price: 420 },
    { title: "Highend PC RTX 4070 i7 13700K 32GB DDR5", price: 850 },
    { title: "Einsteiger PC GTX 1650 i5 10400F Top Zustand", price: 380 },
    { title: "Gaming Monster RTX 4090 i9 14900K", price: 1950 },
    { title: "Budget Gaming PC RX 6600 Ryzen 5 3600", price: 320 },
    { title: "Gaming PC RTX 3070 Ti i7 11700K SSD", price: 550 },
    { title: "PC GTX 1060 6GB i5 8400 16GB", price: 290 },
    { title: "AMD Gaming PC RX 6700 XT Ryzen 7 5700X", price: 490 }
];

function toggleBot() {
    const btn = document.getElementById("toggleBtn");
    const dot = document.getElementById("dot");
    const status = document.getElementById("statusText");

    if (!isRunning) {
        isRunning = true;
        btn.innerText = "Bot Stoppen 🛑";
        btn.className = "btn btn-stop";
        dot.className = "pulse-dot active";
        status.innerText = "Sucht aktiv auf eBay...";
        fetchNewPcs();
        botInterval = setInterval(fetchNewPcs, searchSpeed);
    } else {
        isRunning = false;
        btn.innerText = "Bot Starten 🚀";
        btn.className = "btn btn-start";
        dot.className = "pulse-dot";
        status.innerText = "Bot gestoppt";
        clearInterval(botInterval);
    }
}

function updateInterval(val) {
    document.getElementById("intervalVal").innerText = val + "s";
    searchSpeed = val * 1000;
    if (isRunning) {
        clearInterval(botInterval);
        botInterval = setInterval(fetchNewPcs, searchSpeed);
    }
}

function parseGPU(title) {
    let text = title.toLowerCase();
    const sorted = Object.keys(GPU_DB).sort((a,b) => b.length - a.length);
    for (let gpu of sorted) {
        if (text.includes(gpu)) return { name: gpu.toUpperCase(), data: GPU_DB[gpu] };
    }
    return null;
}

function fetchNewPcs() {
    const randomItem = MOCK_LISTINGS[Math.floor(Math.random() * MOCK_LISTINGS.length)];
    // Preis leicht variieren
    const price = randomItem.price + Math.floor(Math.random() * 40) - 20; 
    addPcToFeed(randomItem.title, price);
}

function addPcToFeed(title, price) {
    const feed = document.getElementById("feed");
    const gpuMatch = parseGPU(title);

    let badgeText = "❌ UNBEKANNT";
    let badgeClass = "badge-bad";
    let fps = { fortnite: "?", gta: "?", roblox: "?", minecraft: "?" };

    if (gpuMatch) {
        const gpu = gpuMatch.data;
        fps = gpu;
        const ratio = (gpu.score / price) * 1000;

        if (ratio >= 110) {
            badgeText = "🔥 EXTREMER DEAL! KAUFEN! 🏆";
            badgeClass = "badge-extreme";
        } else if (ratio >= 75) {
            badgeText = "✅ GUTER DEAL 💪";
            badgeClass = "badge-good";
        } else if (ratio >= 50) {
            badgeText = "⚠️ OKAYER DEAL 🤔";
            badgeClass = "badge-ok";
        } else {
            badgeText = "💀 OVERPRICED ⚰️";
            badgeClass = "badge-bad";
        }
    }

    const card = document.createElement("div");
    card.className = "pc-card";
    card.innerHTML = `
        <div class="pc-header">
            <h3 class="pc-title">${title}</h3>
            <span class="pc-price">${price} €</span>
        </div>
        <div>
            <span class="badge ${badgeClass}">${badgeText}</span>
            <span style="font-size: 0.85rem; color: var(--subtext); margin-left: 8px;">
                ⚙️️ GPU: ${gpuMatch ? gpuMatch.name : "Keine erkannt"}
            </span>
        </div>
        <div class="fps-grid">
            <div class="fps-box"><div>Fortnite</div><div class="fps-value">~${fps.fortnite}</div></div>
            <div class="fps-box"><div>GTA V</div><div class="fps-value">~${fps.gta}</div></div>
            <div class="fps-box"><div>Roblox</div><div class="fps-value">~${fps.roblox}</div></div>
            <div class="fps-box"><div>Minecraft</div><div class="fps-value">~${fps.minecraft}</div></div>
        </div>
    `;

    feed.insertBefore(card, feed.firstChild);

    // Feed begrenzen
    if (feed.children.length > 15) {
        feed.removeChild(feed.lastChild);
    }
}

function clearFeed() {
    document.getElementById("feed").innerHTML = "";
}
</script>

</body>
</html>
