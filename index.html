<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate eBay PC Scanner 100% GPU KI</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #6366f1;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --text: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        input {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .result-card {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .badge-extreme { background: #8b5cf6; color: #fff; }
        .badge-good { background: var(--success); color: #fff; }
        .badge-ok { background: var(--warning); color: #000; }
        .badge-bad { background: var(--danger); color: #fff; }

        .fps-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .fps-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #334155;
        }

        .fps-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ Ultimate eBay PC & GPU Scanner 100%</h1>

    <div class="card">
        <div class="input-group">
            <input type="text" id="titleInput" placeholder="eBay Angebotstitel (z.B. Gaming PC RTX 3060 Ti i7 16GB)">
            <input type="number" id="priceInput" placeholder="Preis in € (z.B. 550)">
            <button onclick="analyzeListing()">Angebots-Check starten 🔥</button>
        </div>
    </div>

    <div id="result" class="card result-card">
        <h2 id="gpuDetected">⚙️ GPU: -</h2>
        <div id="dealBadge" class="badge"></div>

        <h3 style="margin-top: 20px;">🎮 Geschätzte FPS (1080p Performance):</h3>
        <div class="fps-grid">
            <div class="fps-box">
                <div>Fortnite</div>
                <div class="fps-value" id="fpsFortnite">-</div>
            </div>
            <div class="fps-box">
                <div>GTA V</div>
                <div class="fps-value" id="fpsGTA">-</div>
            </div>
            <div class="fps-box">
                <div>Roblox</div>
                <div class="fps-value" id="fpsRoblox">-</div>
            </div>
            <div class="fps-box">
                <div>Minecraft</div>
                <div class="fps-value" id="fpsMinecraft">-</div>
            </div>
        </div>
    </div>
</div>

    // Intel Arc Serie
    "arc a770": { score: 47, fortnite: 175, gta: 95, roblox: 230, minecraft: 210 },

    "arc a580": { score: 36, fortnite: 135, gta: 75, roblox: 180, minecraft: 160 },

function parseGPU(text) {
    // Text bereinigen (Mehrfache Leerzeichen entfernen & kleinmachen)
    let cleanText = text.toLowerCase().replace(/[-_]/g, ' ').replace(/\s+/g, ' ');

    // Sortieren nach Länge (damit "rtx 4070 ti" vor "rtx 4070" gematcht wird!)
    const sortedKeys = Object.keys(GPU_DATABASE).sort((a, b) => b.length - a.length);

    for (let gpuKey of sortedKeys) {
        if (cleanText.includes(gpuKey)) {
            return { name: gpuKey.toUpperCase(), data: GPU_DATABASE[gpuKey] };
        }
    }
    return null;
}

function analyzeListing() {
    const title = document.getElementById("titleInput").value;
    const price = parseFloat(document.getElementById("priceInput").value);

    if (!title || isNaN(price) || price <= 0) {
        alert("Bitte einen gültigen Titel und Preis eingeben! 💀");
        return;
    }

    const matchedGPU = parseGPU(title);
    const resultDiv = document.getElementById("result");
    const gpuTitle = document.getElementById("gpuDetected");
    const badge = document.getElementById("dealBadge");

    resultDiv.style.display = "block";

    if (!matchedGPU) {
        gpuTitle.innerText = "⚙️ GPU: Nicht direkt im Titel erkannt 😭";
        badge.innerText = "❌ UNBEKANNT / Keine Grafikkarte erkannt";
        badge.className = "badge badge-bad";
        document.getElementById("fpsFortnite").innerText = "?";
        document.getElementById("fpsGTA").innerText = "?";
        document.getElementById("fpsRoblox").innerText = "?";
        document.getElementById("fpsMinecraft").innerText = "?";
        return;
    }

    const gpu = matchedGPU.data;
    gpuTitle.innerText = `⚙️ GPU: ${matchedGPU.name}`;

    // Preis-Leistungs-Formel
    const ratio = (gpu.score / price) * 1000;

    if (ratio >= 110) {
        badge.innerText = "🔥 EXTREMER DEAL! Sofort kaufen! 🏆";
        badge.className = "badge badge-extreme";
    } else if (ratio >= 75) {
        badge.innerText = "✅ GUTER DEAL! Fairer Preis 💪";
        badge.className = "badge badge-good";
    } else if (ratio >= 50) {
        badge.innerText = "⚠️ OKAYER DEAL (Kein Schnäppchen) 🤔";
        badge.className = "badge badge-ok";
    } else {
        badge.innerText = "💀 OVERPRICED! Lass die Finger davon! ⚰️";
        badge.className = "badge badge-bad";
    }

    // FPS-Werte setzen
    document.getElementById("fpsFortnite").innerText = `~${gpu.fortnite} FPS`;
    document.getElementById("fpsGTA").innerText = `~${gpu.gta} FPS`;
    document.getElementById("fpsRoblox").innerText = `~${gpu.roblox} FPS`;
    document.getElementById("fpsMinecraft").innerText = `~${gpu.minecraft} FPS`;
}
</script>

</body>
</html>
